<!doctype html>
<html lang="ar" dir="rtl">
<head>

<title>ساعة رملية | مؤقت DEM</title>

<style>
:root{color-scheme:dark;--ink:#f5e8d3;--mute:#aeb8c5;--brass:#e5c080;--brass2:#a77b42;--night:#0b1421;--panel:#ffffff0d;--line:#ffffff26;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;font-family:Cairo,Tahoma,Arial,sans-serif;color:var(--ink);background:radial-gradient(ellipse at 50% 30%,#26384c,var(--night) 66%,#060a11)}
[hidden]{display:none!important}
.app{height:100%;display:flex;flex-direction:column;gap:8px;padding:8px 12px 10px;max-width:860px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:20px;margin:0;color:#f0d4a4;line-height:1.2}
h1 small{display:block;font-size:11px;font-weight:400;color:var(--mute)}
#stage{position:relative;flex:1;min-height:220px}
#stage canvas{width:100%;height:100%;display:block;touch-action:none}
#error{display:none;position:absolute;inset:10px;z-index:3;align-items:center;justify-content:center;text-align:center;padding:18px;border:1px solid #a65e48;background:#351d1d;border-radius:14px;color:#ffd7a0}
#status{position:absolute;inset-inline:0;bottom:2px;text-align:center;font-size:12px;color:var(--mute);pointer-events:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px;display:grid;gap:10px}
.time{display:grid;gap:6px;justify-items:center}
#clock{font-size:38px;font-weight:700;line-height:1;color:#f2d29a;font-variant-numeric:tabular-nums;letter-spacing:1px}
.panel.done #clock{color:#ff9d6b}
.bar{width:100%;height:6px;border-radius:3px;background:#ffffff1a;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brass2),var(--brass))}
.chips,.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
button,select,input{font:inherit;font-size:14px;min-height:44px;border-radius:12px;border:1px solid #d5b47b66;color:#f7e8ce;background:linear-gradient(#51412e,#30271d);padding:0 14px;cursor:pointer}
.chips button{min-width:58px;padding:0 10px;background:#ffffff0f;border-color:var(--line)}
.chips button.on{background:linear-gradient(135deg,var(--brass),var(--brass2));color:#24190c;border:0;font-weight:700}
input{cursor:text;width:92px;text-align:center;background:#ffffff0f;border-color:var(--line)}
.row button{flex:1;max-width:180px}
button.primary{background:linear-gradient(135deg,var(--brass),var(--brass2));border:0;color:#24190c;font-weight:700;flex:1.4}
button:disabled{opacity:.45}
:is(button,input,select):focus-visible{outline:2px solid var(--brass);outline-offset:2px}
#gear{min-height:40px;width:40px;padding:0;background:var(--panel);border-color:var(--line)}
#menu{display:grid;gap:10px;background:#101a28f2;border:1px solid var(--line);border-radius:16px;padding:12px;font-size:13px}
#menu label{display:flex;align-items:center;justify-content:space-between;gap:10px}
#menu input[type=checkbox]{width:22px;min-height:22px}
#menu select{min-height:38px}
#stats{font-size:11px;color:var(--mute)}
@media(max-height:620px){#clock{font-size:30px}.panel{gap:6px;padding:8px}button,input{min-height:38px}}
</style>

<main class="app">
<header>
<h1>♾️<small>مؤقت بمحاكاة حبيبية DEM</small></h1>
<button id="gear" aria-label="الإعدادات" aria-expanded="false">⚙</button>
</header>
<div id="menu" hidden>
<label>دقة الرمل <select id="quality"><option value="1400">خفيفة</option><option value="2200" selected>متوازنة</option><option value="3200">دقيقة</option></select></label>
<label>صوت التنبيه <input type="checkbox" id="sound" checked></label>

</div>
<div class="row"><button class="primary" id="go">▶ ابدأ</button><button id="flip">⟳ اقلب</button><button id="reset">↺ إعادة</button></div>
</section>

<script>
/* ===== DEM core: spheres with spin, spring-dashpot normal force, Cundall-Strack friction, rolling resistance ===== */
const Sim=(()=>{
 const MAXN=3200,R=.018,DT=1e-3,MC=10,KN=6000,GN=35,KT=1100,GT=9,MU=.5,MUR=.25,GW=60,ZH=.45,G=9.81;
const p=new Float64Array(MAXN*3),v=new Float64Array(MAXN*3),w=new Float64Array(MAXN*3),f=new Float64Array(MAXN*3),q=new Float64Array(MAXN*3);
const rad=new Float64Array(MAXN),im=new Float64Array(MAXN),ii=new Float64Array(MAXN);
const CS=.04,X0=-1.2,Y0=-2.1,NX=60,NY=105,head=new Int32Array(NX*NX*NY).fill(-1),nxt=new Int32Array(MAXN),cell=new Int32Array(MAXN);
const cid=new Int32Array(MAXN*MC),cst=new Int32Array(MAXN*MC).fill(-9),hx=new Float64Array(MAXN*MC),hy=new Float64Array(MAXN*MC),hz=new Float64Array(MAXN*MC);
const OFF=[];for(let dy=-1;dy<=1;dy++)for(let dz=-1;dz<=1;dz++)for(let dx=-1;dx<=1;dx++)OFF.push(dx+dz*NX+dy*NX*NX);
const WP=[[0,.11],[.12,.115],[.31,.195],[.59,.345],[.88,.535],[1.15,.715],[1.41,.875],[1.64,.98],[1.79,1.015],[1.94,.99]];
const RT=new Float64Array(210);
for(let k=0;k<210;k++){const a=k*.01;let r=.99;for(let n=1;n<WP.length;n++){const[y1,r1]=WP[n-1],[y2,r2]=WP[n];if(a<=y2){r=r1+(r2-r1)*(a-y1)/(y2-y1);break;}}RT[k]=r;}
let WR=0,SL=0;
function wallAt(ay){const kk=Math.min(ay*100,205),k=kk|0,a=RT[k],b=RT[k+1];WR=a+(b-a)*(kk-k);SL=(b-a)*100;}
let rng=87341;const rand=()=>{rng=(rng*1664525+1013904223)>>>0;return rng/4294967296;};
const S={n:0,p,rad,gx:0,gy:-G,G,up:1,lock:true,drag:0,contacts:0,steps:0,MAXN};

S.reset=function(n){
 n=Math.min(n,MAXN);rng=87341;cst.fill(-9);v.fill(0);w.fill(0);S.steps=0;
 for(let i=0;i<n;i++){rad[i]=R*(.94+rand()*.12);const m=Math.pow(rad[i]/R,3);im[i]=1/m;ii[i]=2.5/(m*rad[i]*rad[i]);}
 let c=0;const sp=R*2.08;
 for(let y=.22,row=0;c<n&&y<1.85;y+=sp,row++){wallAt(y);const lim=WR-R*1.4,o=(row%2)*.5;
  for(let iz=-30;iz<=30&&c<n;iz++)for(let ix=-30;ix<=30&&c<n;ix++){
   const x=(ix+o)*sp,z=(iz+o)*sp;
   if(x*x+z*z<lim*lim){const k=c*3;p[k]=x+(rand()-.5)*.001;p[k+1]=y;p[k+2]=z+(rand()-.5)*.001;c++;}
  }}
 S.n=c;
};
function slot(i,j,st){
 const b=i*MC;let free=-1;
 for(let k=b;k<b+MC;k++){if(cid[k]===j&&cst[k]>=st-1){cst[k]=st;return k;}if(free<0&&cst[k]<st-1)free=k;}
 if(free<0)free=b;cid[free]=j;cst[free]=st;hx[free]=hy[free]=hz[free]=0;return free;
}
function pair(i,j,st){
 const a=i*3,b=j*3,dx=p[b]-p[a],dy=p[b+1]-p[a+1],dz=p[b+2]-p[a+2],ri=rad[i],rj=rad[j],rr=ri+rj,d2=dx*dx+dy*dy+dz*dz;
 if(d2>=rr*rr||d2<1e-12)return;
 const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,nz=dz/d,over=rr-d;
 const rx=v[b]-v[a]-rj*(w[b+1]*nz-w[b+2]*ny)-ri*(w[a+1]*nz-w[a+2]*ny);
 const ry=v[b+1]-v[a+1]-rj*(w[b+2]*nx-w[b]*nz)-ri*(w[a+2]*nx-w[a]*nz);
 const rz=v[b+2]-v[a+2]-rj*(w[b]*ny-w[b+1]*nx)-ri*(w[a]*ny-w[a+1]*nx);
 const vn=rx*nx+ry*ny+rz*nz,fn=Math.max(0,KN*over-GN*vn);
 const tx=rx-vn*nx,ty=ry-vn*ny,tz=rz-vn*nz,k=slot(i,j,st);
 let h0=hx[k]+tx*DT,h1=hy[k]+ty*DT,h2=hz[k]+tz*DT;const pr=h0*nx+h1*ny+h2*nz;h0-=pr*nx;h1-=pr*ny;h2-=pr*nz;
 let fx=-KT*h0-GT*tx,fy=-KT*h1-GT*ty,fz=-KT*h2-GT*tz;const ft=Math.hypot(fx,fy,fz),mx=MU*fn;
 if(ft>mx){const s=mx/ft;fx*=s;fy*=s;fz*=s;h0=-(fx+GT*tx)/KT;h1=-(fy+GT*ty)/KT;h2=-(fz+GT*tz)/KT;}
 hx[k]=h0;hy[k]=h1;hz[k]=h2;
 const Fx=fn*nx+fx,Fy=fn*ny+fy,Fz=fn*nz+fz;
 f[a]-=Fx;f[a+1]-=Fy;f[a+2]-=Fz;f[b]+=Fx;f[b+1]+=Fy;f[b+2]+=Fz;
 const cx=ny*fz-nz*fy,cy=nz*fx-nx*fz,cz=nx*fy-ny*fx;
 q[a]-=ri*cx;q[a+1]-=ri*cy;q[a+2]-=ri*cz;q[b]-=rj*cx;q[b+1]-=rj*cy;q[b+2]-=rj*cz;
 let ox=w[a]-w[b],oy=w[a+1]-w[b+1],oz=w[a+2]-w[b+2];const on=ox*nx+oy*ny+oz*nz;ox-=on*nx;oy-=on*ny;oz-=on*nz;
 const om=Math.hypot(ox,oy,oz);
 if(om>1e-9){const tau=MUR*fn*(ri*rj/rr)/Math.max(om,.5);q[a]-=tau*ox;q[a+1]-=tau*oy;q[a+2]-=tau*oz;q[b]+=tau*ox;q[b+1]+=tau*oy;q[b+2]+=tau*oz;}
 S.contacts++;
}
function wallC(i,nx,ny,nz,over){
 const a=i*3,r=rad[i];
 const rx=v[a]-r*(w[a+1]*nz-w[a+2]*ny),ry=v[a+1]-r*(w[a+2]*nx-w[a]*nz),rz=v[a+2]-r*(w[a]*ny-w[a+1]*nx);
 const vn=rx*nx+ry*ny+rz*nz,fn=Math.max(0,KN*over-GN*vn);
 const tx=rx-vn*nx,ty=ry-vn*ny,tz=rz-vn*nz,tm=Math.hypot(tx,ty,tz),mg=tm>1e-9?Math.min(MU*fn,GW*tm)/tm:0;
 const fx=-tx*mg,fy=-ty*mg,fz=-tz*mg;
 f[a]+=fn*nx+fx;f[a+1]+=fn*ny+fy;f[a+2]+=fn*nz+fz;
 q[a]-=r*(ny*fz-nz*fy);q[a+1]-=r*(nz*fx-nx*fz);q[a+2]-=r*(nx*fy-ny*fx);
 let ox=w[a],oy=w[a+1],oz=w[a+2];const on=ox*nx+oy*ny+oz*nz;ox-=on*nx;oy-=on*ny;oz-=on*nz;
 const om=Math.hypot(ox,oy,oz);if(om>1e-9){const tau=MUR*fn*r/Math.max(om,.5);q[a]-=tau*ox;q[a+1]-=tau*oy;q[a+2]-=tau*oz;}
 S.contacts++;
}
function bounds(i){
 const a=i*3,x=p[a],y=p[a+1],z=p[a+2],r=rad[i],rho=Math.hypot(x,z);
 wallAt(Math.abs(y));
 // true surface normal of the sloped glass (not just radial)
 const m=SL*(y<0?-1:1),inv=1/Math.sqrt(1+m*m),over=r-(WR-rho)*inv;
 if(over>0&&rho>1e-8){
  const nx=-x/rho*inv,ny=m*inv,nz=-z/rho*inv;wallC(i,nx,ny,nz,over);
  if(over>.6*r){const s=over-.6*r;p[a]+=nx*s;p[a+1]+=ny*s;p[a+2]+=nz*s;}
 }
 const lo=-1.91+r,hi=1.91-r;
 if(y<lo){wallC(i,0,1,0,lo-y);if(lo-y>.6*r)p[a+1]=lo-.6*r;}
 else if(y>hi){wallC(i,0,-1,0,y-hi);if(y-hi>.6*r)p[a+1]=hi+.6*r;}
}
	S.step=function(){
	 const n=S.n,st=++S.steps;f.fill(0,0,n*3);q.fill(0,0,n*3);S.contacts=0;
	 // تصفير جميع رؤوس الخلايا قبل إعادة بناء القائمة؛ ترك خلية قديمة
	 // يؤدي إلى اصطدامات وهمية وقد يوقف سقوط الرمل بعد عدة إطارات.
	 head.fill(-1);
	 for(let i=0;i<n;i++){
	  const a=i*3,cx=Math.min(NX-2,Math.max(1,((p[a]-X0)/CS)|0)),cz=Math.min(NX-2,Math.max(1,((p[a+2]-X0)/CS)|0)),cy=Math.min(NY-2,Math.max(1,((p[a+1]-Y0)/CS)|0));
	  const c=cx+cz*NX+cy*NX*NX;cell[i]=c;nxt[i]=head[c];head[c]=i;
	 }
 for(let i=0;i<n;i++){
  const c=cell[i];
  for(let o=0;o<27;o++)for(let j=head[c+OFF[o]];j>=0;j=nxt[j])if(j>i)pair(i,j,st);
  bounds(i);
 }
	 const gx=S.gx,gy=S.gy,Dc=S.drag,lock=S.lock;
 for(let i=0;i<n;i++){
  const a=i*3,m=im[i],ay=Math.abs(p[a+1]);
  v[a]+=(f[a]*m+gx)*DT;v[a+1]+=(f[a+1]*m+gy)*DT;v[a+2]+=f[a+2]*m*DT;
  if(lock){if(ay<.38){v[a]=v[a+1]=v[a+2]=0;}}
  else if(Dc>0&&ay<ZH){const k=1+Dc*(1-ay/ZH)*m*DT;v[a]/=k;v[a+1]/=k;v[a+2]/=k;} // implicit neck drag = flow valve
  const s=ii[i]*DT;w[a]=(w[a]+q[a]*s)*.9995;w[a+1]=(w[a+1]+q[a+1]*s)*.9995;w[a+2]=(w[a+2]+q[a+2]*s)*.9995;
  v[a]*=.9999;v[a+1]*=.9999;v[a+2]*=.9999;
  p[a]+=v[a]*DT;p[a+1]+=v[a+1]*DT;p[a+2]+=v[a+2]*DT;
 }
};
// fraction of sand that has passed the neck (smooth), measured along the gravity-down side
S.progress=function(){let s=0;for(let i=0;i<S.n;i++){const u=S.up*p[i*3+1];s+=Math.min(1,Math.max(0,.5-u/.4));}return s/S.n;};
S.DT=DT;
return S;})();
</script>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const S=Sim,$=s=>document.querySelector(s);
const host=$('#stage'),errorBox=$('#error');
function fail(s){errorBox.style.display='flex';errorBox.textContent='تعذّر تشغيل الساعة: '+s;}
window.addEventListener('error',e=>{if(e.message)fail(e.message)});
window.addEventListener('unhandledrejection',e=>fail(e.reason?.message||'فشل تحميل مكتبة 3D'));

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(34,1,.1,100);
camera.position.set(4.4,2.1,8.1);camera.lookAt(0,0,0);
let renderer;
try{renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});}
catch(e){fail('المتصفح لا يدعم WebGL.');throw e;}
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
host.appendChild(renderer.domElement);
const orbit=new OrbitControls(camera,renderer.domElement);
orbit.enableDamping=true;orbit.dampingFactor=.06;orbit.minDistance=4.5;orbit.maxDistance=13;
scene.add(new THREE.HemisphereLight(0xdceaff,0x50351d,1.35));
const keyLight=new THREE.DirectionalLight(0xffe5c4,3.2);keyLight.position.set(4,7,5);keyLight.castShadow=true;keyLight.shadow.mapSize.set(1024,1024);scene.add(keyLight);
const fill=new THREE.DirectionalLight(0x9ecaff,1.3);fill.position.set(-5,2,-4);scene.add(fill);
const warm=new THREE.PointLight(0xffc879,18,12);warm.position.set(2,-.7,3);scene.add(warm);

const rig=new THREE.Group();scene.add(rig);
const wood=new THREE.MeshStandardMaterial({color:0x79502c,roughness:.34,metalness:.12});
const darkWood=new THREE.MeshStandardMaterial({color:0x352316,roughness:.5});
const brass=new THREE.MeshStandardMaterial({color:0xc49a5b,metalness:.72,roughness:.25});
const glassMat=new THREE.MeshPhysicalMaterial({color:0xeaf5ff,roughness:.075,transmission:.82,thickness:.12,ior:1.47,side:THREE.DoubleSide,transparent:true,opacity:.32,depthWrite:false});
const outer=[[.98,-1.98],[1.025,-1.92],[1.05,-1.8],[1.015,-1.63],[.91,-1.4],[.75,-1.14],[.57,-.87],[.38,-.59],[.23,-.31],[.15,-.12],[.145,0],[.15,.12],[.23,.31],[.38,.59],[.57,.87],[.75,1.14],[.91,1.4],[1.015,1.63],[1.05,1.8],[1.025,1.92],[.98,1.98]];
const inner=[[.95,-1.94],[.99,-1.89],[1.015,-1.79],[.98,-1.64],[.875,-1.41],[.715,-1.15],[.535,-.88],[.345,-.59],[.195,-.31],[.115,-.12],[.11,0],[.115,.12],[.195,.31],[.345,.59],[.535,.88],[.715,1.15],[.875,1.41],[.98,1.64],[1.015,1.79],[.99,1.89],[.95,1.94]];
const shell=outer.concat([...inner].reverse()).map(([r,y])=>new THREE.Vector2(r,y));
const glass=new THREE.Mesh(new THREE.LatheGeometry(shell,160),glassMat);glass.renderOrder=5;rig.add(glass);
const glintMat=new THREE.MeshBasicMaterial({color:0xf4f8ff,transparent:true,opacity:.6});
for(const a of [-.42,.42]){const c=new THREE.CatmullRomCurve3(outer.map(([r,y])=>new THREE.Vector3(r*Math.cos(a),y,r*Math.sin(a))));rig.add(new THREE.Mesh(new THREE.TubeGeometry(c,150,.009,8,false),glintMat));}
function cap(y){const s=y>0?-1:1,m=new THREE.Mesh(new THREE.CylinderGeometry(1.04,1.04,.18,96),wood);m.position.y=y;m.castShadow=true;rig.add(m);
 const t=new THREE.Mesh(new THREE.TorusGeometry(1.025,.035,12,100),brass);t.rotation.x=Math.PI/2;t.position.y=y+s*.02;rig.add(t);
 const d=new THREE.Mesh(new THREE.CylinderGeometry(.9,.9,.02,96),darkWood);d.position.y=y+s*.101;rig.add(d);
 const h=new THREE.Mesh(new THREE.CylinderGeometry(.15,.15,.026,48),brass);h.position.y=y+s*.12;rig.add(h);}
cap(2.03);cap(-2.03);
const base=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshStandardMaterial({color:0x101a28,roughness:.9}));base.rotation.x=-Math.PI/2;base.position.y=-2.22;scene.add(base);

const sand=new THREE.InstancedMesh(new THREE.SphereGeometry(1,10,8),new THREE.MeshStandardMaterial({color:0xd7a34e,roughness:.98}),S.MAXN);
sand.instanceMatrix.setUsage(THREE.DynamicDrawUsage);sand.castShadow=true;sand.receiveShadow=true;rig.add(sand);
{const pal=[0xb87929,0xc58b36,0xd49b45,0xe2b45d,0xf0c979,0xc18a37],c=new THREE.Color();for(let i=0;i<S.MAXN;i++){c.setHex(pal[(i*7919)%pal.length]);sand.setColorAt(i,c);}}
const dummy=new THREE.Object3D();
function updateMeshes(){const p=S.p,r=S.rad;for(let i=0;i<S.n;i++){const k=i*3;dummy.position.set(p[k],p[k+1],p[k+2]);dummy.scale.setScalar(r[i]);dummy.updateMatrix();sand.setMatrixAt(i,dummy.matrix);}sand.count=S.n;sand.instanceMatrix.needsUpdate=true;}
function resize(){const w=Math.max(1,host.clientWidth),h=Math.max(1,host.clientHeight);renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(host);resize();

/* ===== Timer + flow control ===== */
// The neck acts as a valve: a PI controller on "seconds behind schedule" tunes drag so the sand empties exactly when the countdown ends.
let mode='idle',paused=false,T=60,t=0,I=0,frac0=0,theta=0,target=0,quality=900,soundOn=true;
const KP=.6,KI=.09;
const clockEl=$('#clock'),fillEl=$('#fill'),statusEl=$('#status'),panel=$('#panel'),goBtn=$('#go');
const fmt=s=>{s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};
function setStatus(){statusEl.textContent=mode==='idle'?'الرمل محجوز. اختر المدة ثم اضغط ابدأ.':mode==='done'?'انتهى الوقت.':paused?'متوقفة مؤقتًا.':'الرمل يتدفق.';}
function ui(){clockEl.textContent=fmt(mode==='idle'?T:T-t);fillEl.style.width=(mode==='idle'?0:Math.min(100,t/T*100))+'%';
 goBtn.textContent=mode==='run'?(paused?'▶ استئناف':'Ⅱ إيقاف مؤقت'):mode==='done'?'▶ ابدأ من جديد':'▶ ابدأ';
 panel.classList.toggle('done',mode==='done');setStatus();}
let ac;
function audio(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume&&ac.resume();}catch(e){}}
function alarm(){
 if(soundOn&&ac)try{[0,.35,.7].forEach(d=>{const o=ac.createOscillator(),g=ac.createGain(),t0=ac.currentTime+d;o.frequency.value=880;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.25,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+.3);o.start(t0);o.stop(t0+.32);});}catch(e){}
 if(navigator.vibrate)navigator.vibrate([200,100,200]);
}
function flip(){target+=Math.PI;S.up=-S.up;
 if(mode==='run'){t=0;I=0;frac0=S.progress();}else{mode='idle';S.lock=true;S.drag=0;}
 paused=false;ui();}
function start(){
 audio();
 if(mode==='run'){paused=!paused;ui();return;}
 if(S.progress()>.5){target+=Math.PI;S.up=-S.up;}
 t=0;I=0;frac0=S.progress();mode='run';paused=false;S.lock=false;S.drag=40*T;ui();
}
function fullReset(){
 mode='idle';paused=false;t=0;I=0;theta=target=0;S.up=1;S.lock=true;S.drag=0;S.reset(quality);rig.rotation.z=0;updateMeshes();ui();
}
function control(dt){
 const prog=(S.progress()-frac0)/Math.max(.05,1-frac0),lag=t-prog*T;
 I=Math.max(-7/KI,Math.min(8/KI,I+lag*dt));
 const s=Math.max(-7,Math.min(8,KP*lag+KI*I));
 S.drag=s>=7.9?0:40*T*Math.exp(-s);
 t+=dt;
 if(t>=T){t=T;mode='done';S.drag=0;S.lock=false;alarm();}
}
$('#chips').addEventListener('click',e=>{const b=e.target.closest('button[data-s]');if(!b||mode==='run')return;
 T=+b.dataset.s;$('#custom').value='';document.querySelectorAll('#chips button').forEach(x=>x.classList.toggle('on',x===b));if(mode==='done'){mode='idle';S.lock=true;}ui();});
$('#custom').addEventListener('input',e=>{const m=parseFloat(e.target.value);if(!(m>0)||mode==='run')return;
 T=Math.max(15,Math.min(3600,Math.round(m*60)));document.querySelectorAll('#chips button').forEach(x=>x.classList.remove('on'));if(mode==='done'){mode='idle';S.lock=true;}ui();});
goBtn.onclick=start;$('#flip').onclick=flip;$('#reset').onclick=fullReset;
$('#gear').onclick=e=>{const m=$('#menu');m.hidden=!m.hidden;e.currentTarget.setAttribute('aria-expanded',String(!m.hidden));setTimeout(resize,0);};
$('#quality').onchange=e=>{quality=+e.target.value;fullReset();};
$('#sound').onchange=e=>{soundOn=e.target.checked;};
$('#showStats').onchange=e=>{$('#stats').hidden=!e.target.checked;};

let last=performance.now(),acc=0;
function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-last)/1000,.05);last=now;
 theta+=(target-theta)*(1-Math.exp(-6*dt));rig.rotation.z=theta;
 S.gx=-S.G*Math.sin(theta);S.gy=-S.G*Math.cos(theta); // gravity expressed in the glass frame
 if(!(mode==='run'&&paused)){
  acc=Math.min(acc+dt,.05);let n=0;
  while(acc>=S.DT&&n<28){S.step();acc-=S.DT;n++;}
  if(mode==='run')control(dt);
 }
 if(mode==='run'||mode==='done')ui();
 updateMeshes();orbit.update();renderer.render(scene,camera);
 if(!$('#stats').hidden)$('#stats').textContent='حبيبات: '+S.n+' • تلامسات: '+S.contacts+' • خطوات: '+S.steps+(mode==='run'?' • كبح العنق: '+Math.round(S.drag):'');
}
fullReset();requestAnimationFrame(animate);
</script>
</body>
</html>
